<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Map Click -> Server</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 80vh; }
    #panel { padding: 12px; }
    #result { white-space: pre; background: #f5f5f5; padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div><b>Click on the map</b> to send coordinates to the server.</div>
    <div id="result">Waiting for click...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const SERVER_URL = "http://127.0.0.1:8000/query";
    const CLASSIFICATION_FILE_URL = "./last_Classification_output.txt";

    // Your points: [lat, lng]
    const points = [
      [33.28875, 35.53925],
      [33.29121, 35.56258],
      [33.26074, 35.55622],
      [33.27201, 35.54889],
      [33.28875, 35.53925],
    ];

    const map = L.map("map");
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // Markers for the given points
    points.forEach((p, idx) => {
      L.marker(p)
        .addTo(map)
        .bindPopup(`Point ${idx + 1}<br>lat=${p[0]}<br>lng=${p[1]}`);
    });

    // Fit map to show all points
    const bounds = L.latLngBounds(points);
    map.fitBounds(bounds.pad(0.2));

    // Optional: connect them with a line (order matters)
    L.polyline(points, { weight: 4 }).addTo(map);

    let clickMarker = null;

    async function sendCoord(lat, lng) {
      // Leaflet gives lat/lng. Server expects x/y.
      // Common mapping: x = lng, y = lat
      const payload = { coord: { x: lng, y: lat } };

      const res = await fetch(SERVER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!res.ok) {
        const text = await res.text();
        throw new Error(`Server error ${res.status}: ${text}`);
      }
      return res.json();
    }

    async function readClassificationFile() {
      // cache: "no-store" helps avoid browser caching old content
      const res = await fetch(CLASSIFICATION_FILE_URL, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`Cannot read ${CLASSIFICATION_FILE_URL} (${res.status})`);
      }
      return res.text();
    }

    function formatClassificationText(text) {
      const t = (text || "").trim();
      if (!t) return "No classification output found (file is empty).";

      // If file contains a single number -> show as percent nicely
      const num = Number(t.replace("%", "").trim());
      if (!Number.isNaN(num) && t.match(/^-?\d+(\.\d+)?%?$/)) {
        return `Classification: ${num.toFixed(2)}%`;
      }

      // Otherwise show raw text
      return `Classification output:\n${t}`;
    }

    map.on("click", async (e) => {
      const lat = e.latlng.lat;
      const lng = e.latlng.lng;

      if (clickMarker) clickMarker.remove();
      clickMarker = L.marker([lat, lng]).addTo(map);

      const resultEl = document.getElementById("result");
      resultEl.textContent = `Sending...\nlat=${lat}\nlng=${lng}`;

      try {
        // 1) send to server
        await sendCoord(lat, lng);

        // 2) read file content after server wrote it
        const fileText = await readClassificationFile();

        // 3) show nicely
        resultEl.textContent =
          `Clicked:\nlat=${lat}\nlng=${lng}\n\n` +
          formatClassificationText(fileText);

      } catch (err) {
        resultEl.textContent = `Error:\n${err.message}`;
      }
    });
  </script>
</body>
</html>
